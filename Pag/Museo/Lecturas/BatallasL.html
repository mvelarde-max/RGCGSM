<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Batallas del Regimiento</title>
    <link rel="stylesheet" href="../../../CSS/OrigenL.css">

    <style>
        .contenido { max-width: 600px; text-align: left; }
        .pagina { display: none; animation: fade .5s; }
        .pagina.activa { display: block; }
        @keyframes fade { from {opacity:0;} to {opacity:1;} }

        .flechas { margin-top: 15px; font-size: 18px; display:flex; justify-content: space-between;}
        .flechas span { padding:5px 10px; background: rgba(0,224,255,.2); border-radius:8px; cursor:pointer; }
        .flechas span:hover { background: rgba(0,224,255,.5); }

        h2 { color: #00e0ff; margin-bottom: 20px; }

        .fila { display:flex; gap:30px; }
        .texto { flex:2; }
        .imagen-cuadro { flex:1; display:flex; justify-content:center; align-items:flex-start; }
        .imagen-cuadro img { width:250px; height:auto; border-radius:10px; box-shadow:0 0 15px rgba(0,224,255,0.6);}
        p { line-height: 1.6; }
    </style>
</head>

<body>
<div class="contenedor">

    <div class="lado">
        <p>BATALLAS</p>

        <div class="flechas"> <span id="btnAnterior" onclick="anterior()">⬅</span> <span id="btnSiguiente" onclick="siguiente()">➡</span> </div>

        <button onclick="window.location.href='../../../index.html'">Inicio</button>
        <button onclick="window.location.href='../Salas.html'">Volver</button>
    </div>

    <div class="centro">
        <div class="fila">
            <div class="contenido texto">

                <!-- Subtítulos de Batallas -->
                <div class="pagina activa" data-imagen="../../../CLIPS/Z320F69.BMP" data-nombre="Batalla de San Lorenzo">
                    <h2>Batalla de San Lorenzo</h2>
                    <p>Primera batalla donde participó el regimiento, liderada por San Martín.</p>
                </div>
                
            </div>

            <div class="imagen-cuadro">
                <img id="imagenDerecha" src="../../CLIPS/BatallaSanLorenzo.jpg" alt="Imagen Batallas">
            </div>
        </div>
    </div>

</div>

<script>

    let pagina = 0;

    const paginas = document.querySelectorAll(".pagina");
    const imagenDerecha = document.getElementById("imagenDerecha");

    const btnAnterior = document.getElementById("btnAnterior");
    const btnSiguiente = document.getElementById("btnSiguiente");

    function mostrarPagina(i) {

        paginas.forEach(p => p.classList.remove("activa"));

        paginas[i].classList.add("activa");

        if(imagenDerecha){
            imagenDerecha.src = paginas[i].dataset.imagen;
        }

        document.title = paginas[i].dataset.nombre;

        const titulo = paginas[i].querySelector('h2');

        if(titulo){
            titulo.textContent = paginas[i].dataset.nombre;
        }

        pagina = i;

        /* BOTON ANTERIOR */

        if(i === 0){

            btnAnterior.style.opacity = "0.3";
            btnAnterior.style.pointerEvents = "none";

        } else {

            btnAnterior.style.opacity = "1";
            btnAnterior.style.pointerEvents = "auto";
        }

        /* BOTON SIGUIENTE */

        if(i === paginas.length - 1){

            btnSiguiente.style.opacity = "0.3";
            btnSiguiente.style.pointerEvents = "none";

        } else {

            btnSiguiente.style.opacity = "1";
            btnSiguiente.style.pointerEvents = "auto";
        }
    }

    function siguiente() {

        if (pagina < paginas.length - 1) {

            pagina++;

            mostrarPagina(pagina);
        }
    }

    function anterior() {

        if (pagina > 0) {

            pagina--;

            mostrarPagina(pagina);
        }
    }

    /* INICIO */
    mostrarPagina(pagina);

</script>

</body>
</html>
